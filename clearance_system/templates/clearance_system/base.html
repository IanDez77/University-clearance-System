<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clearance System{% endblock %}</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --brand:#1d4ed8;
            --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2; --wait:#92400e; --waitbg:#fef3c7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .bar { max-width:900px; margin:0 auto; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .brand { font-weight:700; color:var(--brand); text-decoration:none; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1.1rem; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:.9rem; }
    .btn { display:inline-block; border:0; border-radius:8px; padding:9px 16px; font-size:.95rem; cursor:pointer; background:var(--brand); color:#fff; text-decoration:none; }
    .btn.ok { background:var(--ok); } .btn.bad { background:var(--bad); } .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.8rem; font-weight:600; }
    .badge.approved { background:var(--okbg); color:var(--ok); } .badge.rejected { background:var(--badbg); color:var(--bad); } .badge.pending { background:var(--waitbg); color:var(--wait); }
    .progress { background:var(--line); border-radius:999px; height:14px; overflow:hidden; margin:10px 0 6px; }
    .progress > div { height:100%; background:var(--ok); }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    input[type=text], input[type=password] { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:1rem; }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; background:#eff6ff; color:#1e40af; }
    .msg.error { background:var(--badbg); color:var(--bad); } .msg.success { background:var(--okbg); color:var(--ok); }
    form.inline { display:inline; } .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    @media print { header, .noprint { display:none; } body { background:#fff; } }
  </style>
</head>
<body>
  <header class="noprint">
    <div class="bar">
      <a class="brand" href="{% url 'clearance:home' %}">University Clearance</a>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'clearance:logout' %}" class="inline">
        {% csrf_token %}
        <span class="muted">{{ user.get_username }}</span>
        <button class="btn ghost" type="submit">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
